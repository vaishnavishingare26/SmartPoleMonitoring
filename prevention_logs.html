<!DOCTYPE html>
<html>

<head>
<title>Short Circuit Prevention Logs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Poppins;
background:#f1f5f9;
}

/* SIDEBAR */
.sidebar{
position:fixed;
width:260px;
height:100vh;
background:linear-gradient(180deg,#0f172a,#1e293b,#134e4a);
color:white;
padding:25px;
}

.sidebar h2{
font-size:26px;
margin-bottom:35px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
margin-bottom:10px;
padding:12px;
border-radius:8px;
background:rgba(255,255,255,0.08);
cursor:pointer;
}

.sidebar li:hover{
background:rgba(255,255,255,0.2);
}

/* MAIN */
.main{
margin-left:280px;
padding:35px;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
text-align:center;
}

/* PANEL */
.panel{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-bottom:25px;
}

/* PIE SIZE FIX */
.pie-container{
width:320px;
height:320px;
margin:auto;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
}

th{
background:#f1f5f9;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #e5e7eb;
text-align:center;
}

/* BLINK */
.blink{
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}

</style>

</head>

<body>

<div class="sidebar">
<h2>Pole Monitor</h2>
<ul>
<li onclick="goDashboard()">Dashboard</li>
<li onclick="goLive()">Live Monitoring</li>
<li onclick="goLogs()">⚡ Prevention Logs</li>
<li>System Logs</li>
</ul>
</div>

<div class="main">

<h1>⚡ Short Circuit Prevention Dashboard</h1>

<!-- CARDS -->
<div class="cards">
<div class="card">
<h3>Pole1</h3>
<p id="p1">-</p>
</div>

<div class="card">
<h3>Pole2</h3>
<p id="p2">-</p>
</div>

<div class="card">
<h3>Status</h3>
<p id="status">Loading...</p>
</div>

<div class="card">
<h3>Total Faults</h3>
<p id="count">-</p>
</div>
</div>

<!-- FLOW -->
<div class="panel">
<h3>⚡ System Flow</h3>
<p id="flow">Loading...</p>
</div>

<!-- GRAPH -->
<div class="panel">
<h3 style="text-align:center;">📊 Fault vs Safe Ratio</h3>

<div class="pie-container">
<canvas id="pie"></canvas>
</div>

</div>

<!-- TABLE -->
<div class="panel">

<h3>⚡ Prevention Logs</h3>

<table>
<thead>
<tr>
<th>Time</th>
<th>Pole1</th>
<th>Pole2</th>
<th>Status</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

</div>

<script>

const CHANNEL_ID="3295497"
const READ_KEY="DG83X1KJHQMSV1RC"

const API=`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_KEY}&results=15`

let chart

function goDashboard(){
window.location.href="dashboard.html"
}

function goLive(){
window.location.href="live_monitoring.html"
}

function goLogs(){
window.location.href="prevention_logs.html"
}

async function fetchData(){

const res=await fetch(API)
const data=await res.json()

const feeds=data.feeds

let safe=0
let fault=0

feeds.forEach(feed=>{
let p1=parseInt(feed.field1)||0
let p2=parseInt(feed.field2)||0

if(p1==1 || p2==1) fault++
else safe++
})

let last=feeds[feeds.length-1]

let p1=parseInt(last.field1)||0
let p2=parseInt(last.field2)||0

document.getElementById("p1").innerText=p1
document.getElementById("p2").innerText=p2

let status=""
let color=""

if(p1==1 || p2==1){
status="🚨 DANGER"
color="red"
document.getElementById("flow").innerText="🚨 Fault → ⚡ Power Cut Activated"
document.getElementById("status").classList.add("blink")
}
else if(p1==0 && p2==0){
status="⚡ POWER CUT"
color="orange"
document.getElementById("flow").innerText="⚡ Power Cut → System Safe"
document.getElementById("status").classList.remove("blink")
}
else{
status="✅ SAFE"
color="green"
document.getElementById("flow").innerText="Normal Power Flow"
}

document.getElementById("status").innerText=status
document.getElementById("status").style.color=color

document.getElementById("count").innerText=fault

let table=document.getElementById("table")
table.innerHTML=""

feeds.slice().reverse().forEach(feed=>{
let a=parseInt(feed.field1)||0
let b=parseInt(feed.field2)||0

let st="SAFE"
let col="green"

if(a==1 || b==1){
st="🚨 DANGER"
col="red"
}
else if(a==0 && b==0){
st="⚡ POWER CUT"
col="orange"
}

table.innerHTML+=`
<tr>
<td>${feed.created_at.substring(11,16)}</td>
<td>${a}</td>
<td>${b}</td>
<td style="color:${col};font-weight:bold">${st}</td>
</tr>
`
})

if(chart) chart.destroy()

chart=new Chart(document.getElementById("pie"),{
type:"pie",
data:{
labels:["Safe","Fault"],
datasets:[{
data:[safe,fault],
backgroundColor:["#22c55e","#ef4444"]
}]
},
options:{
responsive:true,
maintainAspectRatio:false
}
})

}

fetchData()
setInterval(fetchData,5000)

</script>

</body>
</html>
