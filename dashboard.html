<!DOCTYPE html>
<html>

<head>

<title>Smart Electrical Pole Monitoring</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Poppins;
background:#f1f5f9;
}

.sidebar{
position:fixed;
width:260px;
height:100vh;
background:linear-gradient(180deg,#0f172a,#1e293b,#134e4a);
color:white;
padding:25px;
}

.sidebar h2{
font-size:26px;
margin-bottom:35px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
margin-bottom:10px;
padding:12px;
border-radius:8px;
background:rgba(255,255,255,0.08);
cursor:pointer;
}

.main{
margin-left:280px;
padding:35px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.card h3{
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:600;
}

.chart-row{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-bottom:30px;
}

.panel{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f1f5f9;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #e5e7eb;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Pole Monitor</h2>

<ul>
<li>Dashboard</li>

<li onclick="window.location.href='live_monitoring.html'">
Live Monitoring
</li>

<!-- ✅ ONLY THIS LINE UPDATED -->
<li onclick="window.location.href='prevention_logs.html'">
⚡ Short Circuit Prevention Logs
</li>

<li>System Logs</li>
</ul>

</div>

<div class="main">

<h1>Electrical Pole Monitoring Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Pole1 Status</h3>
<p id="pole1">0</p>
</div>

<div class="card">
<h3>Pole2 Status</h3>
<p id="pole2">0</p>
</div>

<div class="card">
<h3>Status</h3>
<p id="status" style="color:green">SAFE</p>
</div>

<div class="card">
<h3>Total Alerts</h3>
<p id="alerts">0</p>
</div>

</div>

<div class="chart-row">

<div class="panel">
<h3>Status Monitoring Graph</h3>
<canvas id="chart"></canvas>
</div>

<div class="panel">
<h3>Status Ratio</h3>
<canvas id="pie"></canvas>
</div>

</div>

<div class="panel">

<h3>Monitoring Records</h3>

<table id="records">

<thead>
<tr>
<th>Time</th>
<th>Pole1</th>
<th>Pole2</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<script>

const CHANNEL_ID="3295497"
const READ_KEY="DG83X1KJHQMSV1RC"

const API=`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_KEY}&results=10`

let alertCount=0
let chart
let pie

async function fetchData(){

try{

const res=await fetch(API)
const data=await res.json()

const feeds=data.feeds

let labels=[]
let pole1=[]
let pole2=[]

feeds.forEach(feed=>{

let p1=parseInt(feed.field1) || 0
let p2=parseInt(feed.field2) || 0

labels.push(feed.created_at.substring(11,19))
pole1.push(p1)
pole2.push(p2)

})

updateCards(pole1[pole1.length-1],pole2[pole2.length-1])
updateGraph(labels,pole1,pole2)
updateTable(feeds)

}catch(e){

console.log("Network Error")

}

}

function updateCards(p1,p2){

document.getElementById("pole1").innerText=p1
document.getElementById("pole2").innerText=p2

let status="SAFE"
let color="green"

if(p1==1 || p2==1){

status="DANGER"
color="red"

}

document.getElementById("status").innerText=status
document.getElementById("status").style.color=color

if(status=="DANGER"){
alertCount++
}

document.getElementById("alerts").innerText=alertCount

}

function updateGraph(labels,p1,p2){

if(chart) chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:labels,
datasets:[
{
label:"Pole1",
data:p1,
borderColor:"#2563eb",
borderWidth:3,
fill:false
},
{
label:"Pole2",
data:p2,
borderColor:"#ef4444",
borderWidth:3,
fill:false
}
]
}

})

let safe=0
let danger=0

p1.forEach((v,i)=>{

if(v==1 || p2[i]==1) danger++
else safe++

})

if(pie) pie.destroy()

pie=new Chart(document.getElementById("pie"),{

type:"pie",

data:{
labels:["Safe","Danger"],
datasets:[{
data:[safe,danger],
backgroundColor:["#22c55e","#ef4444"]
}]
}

})

}

function updateTable(feeds){

const body=document.querySelector("#records tbody")

body.innerHTML=""

feeds.slice().reverse().forEach(feed=>{

let p1=parseInt(feed.field1) || 0
let p2=parseInt(feed.field2) || 0

let status="SAFE"
let color="green"

if(p1==1 || p2==1){

status="DANGER"
color="red"

}

body.innerHTML+=`

<tr>
<td>${feed.created_at.substring(11,16)}</td>
<td>${p1}</td>
<td>${p2}</td>
<td style="color:${color};font-weight:bold">${status}</td>
</tr>

`

})

}

fetchData()
setInterval(fetchData,5000)

</script>

</body>
</html>
